<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>模拟省市区三级级联表单</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: #f5f5f5; }
  .form { max-width: 480px; margin: 60px auto; background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .form h2 { margin: 0 0 24px; font-size: 18px; color: #333; }
  .field { margin-bottom: 20px; }
  .field label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; }
  .field select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; background: #fff; }
  .result { margin-top: 24px; padding: 12px; background: #f0f9eb; border-radius: 4px; color: #3c763d; font-size: 13px; display: none; }
</style>
</head>
<body>
<div class="form">
  <h2>收货地址（省/市/区级联）</h2>
  <div class="field">
    <label for="province">省份</label>
    <select id="province" name="province">
      <option value="">请选择省份</option>
    </select>
  </div>
  <div class="field">
    <label for="city">城市</label>
    <select id="city" name="city" disabled>
      <option value="">请选择城市</option>
    </select>
  </div>
  <div class="field">
    <label for="district">区县</label>
    <select id="district" name="district" disabled>
      <option value="">请选择区县</option>
    </select>
  </div>
  <div class="result" id="result"></div>
</div>
<script>
  // 省 -> 市 -> 区 三级数据
  var data = {
    '广东省': {
      '深圳市': ['南山区', '福田区', '罗湖区'],
      '广州市': ['天河区', '越秀区', '海珠区'],
      '珠海市': ['香洲区', '斗门区']
    },
    '北京市': {
      '北京市': ['朝阳区', '海淀区', '东城区', '西城区']
    },
    '江苏省': {
      '南京市': ['玄武区', '鼓楼区', '秦淮区'],
      '苏州市': ['姑苏区', '吴中区', '工业园区']
    }
  };

  var province = document.getElementById('province');
  var city = document.getElementById('city');
  var district = document.getElementById('district');
  var result = document.getElementById('result');

  // 初始化省份
  Object.keys(data).forEach(function (p) {
    var opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    province.appendChild(opt);
  });

  function fill(select, list) {
    select.innerHTML = '';
    var placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = list.length ? '请选择' : '请选择';
    select.appendChild(placeholder);
    list.forEach(function (v) {
      var opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      select.appendChild(opt);
    });
  }

  function showResult() {
    var p = province.value, c = city.value, d = district.value;
    if (p && c && d) {
      result.style.display = 'block';
      result.textContent = '已选择: ' + p + ' / ' + c + ' / ' + d;
    } else {
      result.style.display = 'none';
    }
  }

  province.addEventListener('change', function () {
    var p = province.value;
    var cities = p ? Object.keys(data[p]) : [];
    fill(city, cities);
    city.disabled = cities.length === 0;
    fill(district, []);
    district.disabled = true;
    showResult();
  });

  city.addEventListener('change', function () {
    var p = province.value, c = city.value;
    var districts = (p && c && data[p][c]) ? data[p][c] : [];
    fill(district, districts);
    district.disabled = districts.length === 0;
    showResult();
  });

  district.addEventListener('change', showResult);
</script>
</body>
</html>
