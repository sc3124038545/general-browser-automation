<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>模拟多步骤下单流程</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: #f5f5f5; }
  .container { max-width: 560px; margin: 40px auto; background: #fff; padding: 28px 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  h2 { margin: 0 0 20px; font-size: 18px; color: #333; }
  .steps { display: flex; margin-bottom: 24px; }
  .steps .step { flex: 1; text-align: center; color: #bbb; font-size: 13px; padding: 8px 0; border-bottom: 2px solid #eee; }
  .steps .step.active { color: #e4393c; border-bottom-color: #e4393c; font-weight: bold; }
  .panel.hidden { display: none; }
  .product { border: 1px solid #eee; border-radius: 6px; padding: 14px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .product.selected { border-color: #e4393c; background: #fff7f7; }
  .product .name { font-size: 15px; color: #333; }
  .product .price { color: #e4393c; font-weight: bold; }
  .field { margin-bottom: 16px; }
  .field label { display: block; margin-bottom: 6px; color: #555; font-size: 13px; }
  .field input, .field select { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
  .pay { display: block; padding: 12px; border: 1px solid #eee; border-radius: 6px; margin-bottom: 10px; cursor: pointer; font-size: 14px; }
  .summary { background: #f9f9f9; border-radius: 6px; padding: 14px; font-size: 13px; line-height: 1.8; color: #555; margin-bottom: 18px; }
  button { padding: 10px 24px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .next { background: #e4393c; color: #fff; }
  .submit { background: #ff9b00; color: #fff; }
  .err { color: #e4393c; font-size: 12px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
<div class="container">
  <h2>下单流程</h2>
  <div class="steps">
    <div class="step active" id="step-ind-1">1 选商品</div>
    <div class="step" id="step-ind-2">2 收货信息</div>
    <div class="step" id="step-ind-3">3 支付方式</div>
    <div class="step" id="step-ind-4">4 确认提交</div>
  </div>

  <!-- 第1步：选商品 -->
  <div class="panel" id="step1">
    <div class="product" data-name="蓝牙耳机" data-price="299">
      <div class="name">蓝牙耳机</div><div class="price">¥299</div>
    </div>
    <div class="product" data-name="智能手表" data-price="899">
      <div class="name">智能手表</div><div class="price">¥899</div>
    </div>
    <div class="product" data-name="充电宝" data-price="129">
      <div class="name">充电宝</div><div class="price">¥129</div>
    </div>
    <div class="err" id="err1"></div>
    <button class="next" onclick="nextStep(1)">下一步</button>
  </div>

  <!-- 第2步：收货信息 -->
  <div class="panel hidden" id="step2">
    <div class="field">
      <label for="name">收货人姓名</label>
      <input id="name" placeholder="请输入姓名">
    </div>
    <div class="field">
      <label for="phone">手机号码</label>
      <input id="phone" placeholder="请输入手机号">
    </div>
    <div class="field">
      <label for="province">省份</label>
      <select id="province"><option value="">请选择省份</option></select>
    </div>
    <div class="field">
      <label for="city">城市</label>
      <select id="city"><option value="">请选择城市</option></select>
    </div>
    <div class="field">
      <label for="district">区县</label>
      <select id="district"><option value="">请选择区县</option></select>
    </div>
    <div class="err" id="err2"></div>
    <button class="next" onclick="nextStep(2)">下一步</button>
  </div>

  <!-- 第3步：支付方式 -->
  <div class="panel hidden" id="step3">
    <label class="pay"><input type="radio" name="pay" value="支付宝"> 支付宝</label>
    <label class="pay"><input type="radio" name="pay" value="微信支付"> 微信支付</label>
    <label class="pay"><input type="radio" name="pay" value="银行卡"> 银行卡</label>
    <div class="err" id="err3"></div>
    <button class="next" onclick="nextStep(3)">下一步</button>
  </div>

  <!-- 第4步：确认提交 -->
  <div class="panel hidden" id="step4">
    <div class="summary" id="summary"></div>
    <button class="submit" onclick="submitOrder()">提交订单</button>
  </div>
</div>

<script>
  var regionData = {
    '广东省': { '深圳市': ['南山区', '福田区', '罗湖区'], '广州市': ['天河区', '越秀区'] },
    '北京市': { '北京市': ['朝阳区', '海淀区'] },
    '江苏省': { '南京市': ['玄武区', '鼓楼区'], '苏州市': ['姑苏区', '吴中区'] }
  };

  // 初始化省份
  var province = document.getElementById('province');
  Object.keys(regionData).forEach(function (p) {
    var opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    province.appendChild(opt);
  });

  function fill(select, list) {
    select.innerHTML = '';
    var ph = document.createElement('option');
    ph.value = '';
    ph.textContent = '请选择';
    select.appendChild(ph);
    list.forEach(function (v) {
      var opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      select.appendChild(opt);
    });
  }

  var city = document.getElementById('city');
  var district = document.getElementById('district');

  province.addEventListener('change', function () {
    var cities = province.value ? Object.keys(regionData[province.value]) : [];
    fill(city, cities);
    fill(district, []);
  });
  city.addEventListener('change', function () {
    var ds = (province.value && city.value && regionData[province.value][city.value]) ? regionData[province.value][city.value] : [];
    fill(district, ds);
  });

  // 选商品
  var selectedProduct = null;
  document.querySelectorAll('.product').forEach(function (card) {
    card.addEventListener('click', function () {
      document.querySelectorAll('.product').forEach(function (c) { c.classList.remove('selected'); });
      card.classList.add('selected');
      selectedProduct = card.getAttribute('data-name');
    });
  });

  function nextStep(n) {
    if (n === 1 && !selectedProduct) { document.getElementById('err1').textContent = '请先选择商品'; return; }
    if (n === 2) {
      if (!document.getElementById('name').value || !document.getElementById('phone').value ||
          !province.value || !city.value || !district.value) {
        document.getElementById('err2').textContent = '请完整填写收货信息';
        return;
      }
    }
    if (n === 3 && !document.querySelector('input[name="pay"]:checked')) {
      document.getElementById('err3').textContent = '请选择支付方式';
      return;
    }
    document.getElementById('step' + n).classList.add('hidden');
    document.getElementById('step' + (n + 1)).classList.remove('hidden');
    document.getElementById('step-ind-' + n).classList.remove('active');
    document.getElementById('step-ind-' + (n + 1)).classList.add('active');

    if (n === 3) {
      var pay = document.querySelector('input[name="pay"]:checked').value;
      document.getElementById('summary').innerHTML =
        '<b>商品</b>：' + selectedProduct + '<br>' +
        '<b>收货人</b>：' + document.getElementById('name').value + '<br>' +
        '<b>手机</b>：' + document.getElementById('phone').value + '<br>' +
        '<b>地址</b>：' + province.value + ' ' + city.value + ' ' + district.value + '<br>' +
        '<b>支付方式</b>：' + pay;
    }
  }

  function submitOrder() {
    var pay = document.querySelector('input[name="pay"]:checked').value;
    var orderNo = 'ORDER' + Date.now();
    var params =
      'order_no=' + encodeURIComponent(orderNo) +
      '&product=' + encodeURIComponent(selectedProduct) +
      '&name=' + encodeURIComponent(document.getElementById('name').value) +
      '&phone=' + encodeURIComponent(document.getElementById('phone').value) +
      '&address=' + encodeURIComponent(province.value + city.value + district.value) +
      '&pay=' + encodeURIComponent(pay);
    location.href = './mock_order_success.html?' + params;
  }
</script>
</body>
</html>
