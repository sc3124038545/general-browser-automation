<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; padding: 16px; }
  .panel { border: 1px solid #eee; border-radius: 6px; padding: 16px; }
  .row { margin-bottom: 12px; }
  label { font-size: 13px; color: #555; display: inline-block; width: 50px; }
  select { padding: 6px 10px; font-size: 14px; }
  button { padding: 8px 20px; border: none; background: #409eff; color: #fff; border-radius: 4px; cursor: pointer; font-size: 14px; }
  #iframe-result { margin-top: 10px; color: #67c23a; font-size: 13px; }
</style>
</head>
<body>
<div class="panel">
  <div class="row">
    <label for="lang">语言</label>
    <select id="lang">
      <option value="zh">中文</option>
      <option value="en">英文</option>
    </select>
  </div>
  <button id="login-btn">iframe登录</button>
  <div id="iframe-result"></div>
</div>
<script>
  document.getElementById('login-btn').addEventListener('click', function () {
    this.textContent = '已登录';
    document.getElementById('iframe-result').textContent = 'iframe 登录按钮被点击';
  });
</script>
</body>
</html>
