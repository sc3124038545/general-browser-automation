<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>iframe / Shadow DOM 交互演示</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: #f5f5f5; }
  .container { max-width: 520px; margin: 30px auto; background: #fff; padding: 28px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  h2 { margin: 0 0 20px; font-size: 18px; color: #333; }
  .section { margin-bottom: 28px; }
  .section h3 { font-size: 15px; color: #666; margin: 0 0 12px; border-left: 3px solid #409eff; padding-left: 8px; }
  iframe { border: 1px solid #eee; border-radius: 6px; }
</style>
</head>
<body>
<div class="container">
  <h2>iframe / Shadow DOM 交互演示</h2>

  <div class="section">
    <h3>1. iframe 内容</h3>
    <iframe id="frame" src="./mock_iframe_content.html" width="480" height="180"></iframe>
  </div>

  <div class="section">
    <h3>2. Shadow DOM 组件</h3>
    <confirm-widget></confirm-widget>
  </div>
</div>

<script>
  class ConfirmWidget extends HTMLElement {
    constructor() {
      super();
      const shadow = this.attachShadow({ mode: 'open' });
      shadow.innerHTML = `
        <style>
          .panel { border: 1px solid #eee; border-radius: 6px; padding: 16px; }
          .row { margin-bottom: 12px; }
          .row span { font-size: 13px; color: #555; display: inline-block; width: 50px; }
          select { padding: 6px 10px; font-size: 14px; }
          button { padding: 8px 20px; border: none; background: #67c23a; color: #fff; border-radius: 4px; cursor: pointer; font-size: 14px; }
          #shadow-result { margin-top: 10px; color: #67c23a; font-size: 13px; }
        </style>
        <div class="panel">
          <div class="row"><span>主题</span><select id="theme">
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select></div>
          <button id="confirm-btn">确认</button>
          <div id="shadow-result"></div>
        </div>
      `;
      shadow.getElementById('confirm-btn').addEventListener('click', function () {
        this.textContent = '已确认';
        shadow.getElementById('shadow-result').textContent = 'shadow 确认按钮被点击';
      });
    }
  }
  customElements.define('confirm-widget', ConfirmWidget);
</script>
</body>
</html>
